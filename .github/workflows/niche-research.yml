name: Niche research
on:
  push:
    branches: ['claude/**']
    paths: ['research/phrases.txt', 'scripts/niche-research.mjs', '.github/workflows/niche-research.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Research niches
        run: node scripts/niche-research.mjs
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results.json research/results.md
          git diff --cached --quiet && exit 0
          git commit -m "Add niche research results"
          git push origin HEAD:${GITHUB_REF_NAME}
